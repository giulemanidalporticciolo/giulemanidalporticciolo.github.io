on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny-lazy
    container:
      image: ruby:3.2
    steps:
      - name: Installa Node.js
        run: |
          apt-get update
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Cache gem
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}

      - name: Build con Jekyll
        run: |
          gem install bundler jekyll
          bundle config set --local path 'vendor/bundle'
          bundle install || true
          bundle exec jekyll build || jekyll build

      - name: Pubblica su Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/
          token: ${{ forge.token }}
          source: _site/
